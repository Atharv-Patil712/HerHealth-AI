services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - herhealth-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  herhealth-data: