services:
  - type: web
    name: herhealth-ai-api
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && python build_unified_model.py && python build_health_kb.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: '["https://herhealth-ai-frontend.onrender.com","https://herhealth-ai-w4yw.onrender.com"]'
